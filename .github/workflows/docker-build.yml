name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push images to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # Run tests before building images
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd apps/backend
          if [ -d "tests" ]; then
            pytest -v --maxfail=3 --cov=app --cov-report=term
          else
            echo "No test directory found - skipping tests"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @cartulary/shared build

      - name: Run frontend type check
        working-directory: apps/web
        run: pnpm type-check

  # Build and push Docker images
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./apps/backend
            dockerfile: ./apps/backend/Dockerfile
            image: backend
            platforms: linux/amd64,linux/arm64

          - name: celery-worker
            context: ./apps/backend
            dockerfile: ./apps/backend/Dockerfile
            image: celery-worker
            platforms: linux/amd64,linux/arm64

          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile
            image: web
            target: production
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Cartulary ${{ matrix.name }}
            org.opencontainers.image.description=Digital archive system - ${{ matrix.name }} container
            org.opencontainers.image.vendor=Cartulary

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          target: ${{ matrix.target || '' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_to_registry != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.name }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.name }}.sarif'
          category: ${{ matrix.name }}

  # Smoke test deployed images
  smoke-test:
    name: Smoke Test Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test backend image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}
          # Bypass entrypoint.sh, which blocks until a postgres host is reachable
          docker run --rm --entrypoint python ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }} --version

      - name: Test web image
        id: test-web
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
          docker pull "$IMAGE"
          # nginx resolves the `backend` upstream at startup and refuses to start
          # when the name doesn't resolve ("host not found in upstream"), and there
          # is no backend on a bare runner. Stub the name here rather than giving
          # nginx.conf a runtime resolver: that would hardcode a DNS address into
          # the shipped image, and every real deployment runs web alongside a
          # backend on one network. Only `/` is exercised, so the stub is never hit.
          docker run -d --name test-web --add-host backend:127.0.0.1 -p 8080:80 "$IMAGE"

          served=""
          for _ in $(seq 30); do
            status=$(docker inspect test-web --format='{{.State.Status}}' 2>/dev/null) || status=missing
            status=${status:-missing}
            case "$status" in
              running|created) ;;
              *)
                echo "::error::web container is $status, expected running"
                exit 1
                ;;
            esac
            if curl -fsS --max-time 2 -o "$RUNNER_TEMP/index.html" http://localhost:8080/; then
              served=yes
              break
            fi
            sleep 1
          done

          if [ -z "$served" ]; then
            echo "::error::no response from http://localhost:8080/ after 30 attempts"
            exit 1
          fi
          if ! grep -q 'id="root"' "$RUNNER_TEMP/index.html"; then
            echo "::error::http://localhost:8080/ did not serve the web app's index.html"
            exit 1
          fi
          echo "web image serves index.html"

      - name: Web container logs
        if: always() && steps.test-web.outcome != 'success'
        run: docker logs test-web || true

      - name: Remove web test container
        if: always()
        run: docker rm -f test-web
